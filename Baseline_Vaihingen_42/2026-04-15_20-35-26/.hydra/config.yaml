cuda_visible_devices:
- 1
training_model: Baseline
training_dataset: Vaihingen
seed: 42
folder: /data3/wsjdataset/Vaihingen_unzip/ISPRS_semantic_labeling_Vaihingen.zip/
model:
  pretrained: true
  model_dim: 512
  num_heads: 8
  ffn_dim: 2048
  dropout: 0.5
  num_layers: 1
  backbone: mit_b3
  decoder_embed_dim: 512
  pretrained_backbone: /home/wsj/CAF-Net-KD/pretrained/mit_b3.pth
  bn_eps: 0.01
  bn_momentum: 0.01
training:
  epochs: 100
  save_epoch: 1
  batch_size: 10
  learning_rate: 0.0001
  weight_decay: 0.0005
  momentum: 0.9
  milestones:
  - 25
  - 35
  - 45
  window_size:
  - 256
  - 256
  num_workers: 0
  cache: true
  augmentation: true
  alpha: 0.01
  beta: 0.05
  gamma: 0.5
  distill:
    enable: false
    teacher_ckpt: ''
    teacher_backbone: mit_b4
    T: 4.0
    lambda_kd: 1.0
    lambda_edge: 1.0
    edge_k: 3
    edge_boost: 1.0
dataset:
  name: ${training_dataset}
  datasets:
    Vaihingen:
      name: Vaihingen
      labels:
      - roads
      - buildings
      - low veg.
      - trees
      - cars
      - clutter
      n_classes: 6
      stride_size: 32
      main_folder: ${folder}
      data_folder: ${.main_folder}/top/top_mosaic_09cm_area{}.tif
      dsm_folder: ${.main_folder}/dsm/dsm_09cm_matching_area{}.tif
      label_folder: ${.main_folder}/gts_for_participants/top_mosaic_09cm_area{}.tif
      eroded_folder: ${.main_folder}/gts_eroded_for_participants/top_mosaic_09cm_area{}_noBoundary.tif
      train_ids:
      - '1'
      - '3'
      - '23'
      - '26'
      - '7'
      - '11'
      - '13'
      - '28'
      - '17'
      - '32'
      - '34'
      - '37'
      test_ids:
      - '5'
      - '21'
      - '15'
      - '30'
      num_train_imgs: 10000
      palette:
        0:
        - 255
        - 255
        - 255
        1:
        - 0
        - 0
        - 255
        2:
        - 0
        - 255
        - 255
        3:
        - 0
        - 255
        - 0
        4:
        - 255
        - 255
        - 0
        5:
        - 255
        - 0
        - 0
        6:
        - 0
        - 0
        - 0
    Potsdam:
      name: Potsdam
      labels:
      - roads
      - buildings
      - low veg.
      - trees
      - cars
      - clutter
      n_classes: 6
      stride_size: 128
      main_folder: ${folder}/Potsdam/
      data_folder: ${.main_folder}/4_Ortho_RGBIR/top_potsdam_{}_RGBIR.tif
      dsm_folder: ${.main_folder}/1_DSM_normalisation/dsm_potsdam_{}_normalized_lastools.jpg
      label_folder: ${.main_folder}/5_Labels_for_participants/top_potsdam_{}_label.tif
      eroded_folder: ${.main_folder}/5_Labels_for_participants_no_Boundary/top_potsdam_{}_label_noBoundary.tif
      train_ids:
